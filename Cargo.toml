[package]
name = "ouros-simulator"
version = "0.1.0"
edition = "2024"

# [lints.clippy]
# pedantic="warn", will add afterwards
# nursery="forbid" #, will add afterwards

[dependencies]
rand = "0.9.2"
vstd = "=0.0.0-2026-01-11-0057"
rayon = "1.10"
indicatif = { version = "0.17", features = ["rayon"] }
clap = { version = "4.6.1", features = ["derive"] }
tracy-client = { version = "0.18.4", default-features = false, features = ["flush-on-exit"] }
dhat = { version = "0.3", optional = true }

[features]
profile = ["tracy-client/enable"]
dhat-heap = ["dep:dhat"]

[package.metadata.verus]
verify = true
